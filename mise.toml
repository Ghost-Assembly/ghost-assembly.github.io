# Toolchain versions only. Commands live in the justfile.
[tools]
node = "24.21.0"
just = "latest"

# Security and lint tooling, pinned here so `just ci` behaves the same on a
# laptop as it does on a runner. Scanners track "latest" on purpose — pinning a
# scanner also pins its vulnerability data, which defeats the point of running it.
actionlint = "latest"
gitleaks = "latest"
osv-scanner = "latest"
zizmor = "latest"
